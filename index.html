<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>B2B Upload — Project pages</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #252536;
      background: #f7f7fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 64px 24px;
    }

    main {
      width: min(880px, 100%);
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      line-height: 1.25;
    }

    .intro {
      margin: 12px 0 32px;
      color: #676778;
      font-size: 16px;
      line-height: 1.5;
    }

    .page-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .page-link {
      display: block;
      height: 100%;
      padding: 24px;
      color: inherit;
      text-decoration: none;
      background: #fff;
      border: 1px solid #e1e1e8;
      border-radius: 12px;
      transition: border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
    }

    .page-link:hover,
    .page-link:focus-visible {
      border-color: #5b3be8;
      box-shadow: 0 8px 24px rgba(37, 37, 54, 0.08);
      transform: translateY(-2px);
      outline: none;
    }

    .page-link strong {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      line-height: 1.4;
    }

    .page-link span {
      color: #676778;
      font-size: 14px;
      line-height: 1.5;
    }

    .page-link .open-page {
      display: block;
      margin-top: 20px;
      color: #5b3be8;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main>
    <h1>Project pages</h1>
    <p class="intro">Select a prototype page to preview.</p>

    <ul class="page-list">
      <li>
        <a class="page-link" href="./cny-quota-prototype/index.html">
          <strong>CNY quota management</strong>
          <span>Main interactive prototype</span>
          <span class="open-page">Open page →</span>
        </a>
      </li>
      <li>
        <a class="page-link" href="./cny-quota-prototype/concept3.html">
          <strong>Concept 3 — English</strong>
          <span>English prototype</span>
          <span class="open-page">Open page →</span>
        </a>
      </li>
      <li>
        <a class="page-link" href="./cny-quota-prototype/concept3-cn.html">
          <strong>Concept 3 — 中文</strong>
          <span>中文原型</span>
          <span class="open-page">打开页面 →</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
